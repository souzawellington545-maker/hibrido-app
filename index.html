<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloxx</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        h1 { color: #00ffcc; }
        p { font-size: 18px; }
    </style>
</head>
<body>
    <h1>Bem-vindo ao Veloxx</h1>
    <p>O seu aplicativo híbrido está a funcionar em modo standalone!</p>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>
</html>
